<!doctype html>
<html lang="es">

<body>

<div class="demo-ribbon">Sitio de demostración — <a href="https://frontyback.com" target="_blank" rel="noopener">frontyback.com</a></div>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand" id="nav-brand">
      <img src="" alt="" class="nav-logo" id="nav-logo" hidden>
      <span class="nav-brand-text" id="nav-brand-text"></span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">

</nav>

    <p class="kicker">Productos y precios</p>

<main>
  <section class="section">
    <div class="section-inner">
      <div id="productos-list"></div>
    </div>
